# Local infrastructure. Use docker-compose.dev.yml for the password-free local stack.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing_ai}
      POSTGRES_USER: ${POSTGRES_USER:-marketing_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-bookworm
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["app"]
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-}
      DATABASE_READINESS_TIMEOUT_SECONDS: ${DATABASE_READINESS_TIMEOUT_SECONDS:-}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-}
      IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-}
      IDENTITY_JWT_HS256_SECRET: ${IDENTITY_JWT_HS256_SECRET:-}
      MIN_DAILY_BUDGET_MAD: ${MIN_DAILY_BUDGET_MAD:-}
      MAX_DAILY_BUDGET_MAD: ${MAX_DAILY_BUDGET_MAD:-}
      MAX_DAILY_BUDGET_PER_SELLER_MAD: ${MAX_DAILY_BUDGET_PER_SELLER_MAD:-}
      MAX_BUDGET_INCREASE_PCT_PER_ACTION: ${MAX_BUDGET_INCREASE_PCT_PER_ACTION:-}
      MIN_HOURS_BETWEEN_BUDGET_CHANGES: ${MIN_HOURS_BETWEEN_BUDGET_CHANGES:-}
      BUDGET_CHANGE_REQUIRES_APPROVAL: ${BUDGET_CHANGE_REQUIRES_APPROVAL:-}
      MIN_STOCK_UNITS_TO_ADVERTISE: ${MIN_STOCK_UNITS_TO_ADVERTISE:-}
      STOCK_FLOOR_TO_AUTO_PAUSE: ${STOCK_FLOOR_TO_AUTO_PAUSE:-}
      MIN_GROSS_MARGIN_PCT: ${MIN_GROSS_MARGIN_PCT:-}
      MAX_ACCEPTABLE_CANCELLATION_RATE_PCT: ${MAX_ACCEPTABLE_CANCELLATION_RATE_PCT:-}
      MAX_ACCEPTABLE_RETURN_RATE_PCT: ${MAX_ACCEPTABLE_RETURN_RATE_PCT:-}
      MIN_ORDERS_FOR_RATE_CONFIDENCE: ${MIN_ORDERS_FOR_RATE_CONFIDENCE:-}
      DELIVERY_COST_PER_ORDER_MAD: ${DELIVERY_COST_PER_ORDER_MAD:-}
      PROFITABILITY_ATTRIBUTION_WINDOW_DAYS: ${PROFITABILITY_ATTRIBUTION_WINDOW_DAYS:-}
      MIN_DAYS_BEFORE_PERFORMANCE_JUDGEMENT: ${MIN_DAYS_BEFORE_PERFORMANCE_JUDGEMENT:-}
      MAX_GRAPH_STEPS: ${MAX_GRAPH_STEPS:-}
      MAX_STRUCTURED_OUTPUT_RETRIES: ${MAX_STRUCTURED_OUTPUT_RETRIES:-}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-}
      MAX_INPUT_TOKENS_PER_RUN: ${MAX_INPUT_TOKENS_PER_RUN:-}
      MAX_OUTPUT_TOKENS_PER_RUN: ${MAX_OUTPUT_TOKENS_PER_RUN:-}
      MAX_AI_PROPOSALS_PER_SELLER_PER_DAY: ${MAX_AI_PROPOSALS_PER_SELLER_PER_DAY:-}
      MAX_LLM_COST_PER_SELLER_PER_DAY_MAD: ${MAX_LLM_COST_PER_SELLER_PER_DAY_MAD:-}
      MAX_SELLER_INSTRUCTION_CHARS: ${MAX_SELLER_INSTRUCTION_CHARS:-}
      IDEMPOTENCY_KEY_TTL_HOURS: ${IDEMPOTENCY_KEY_TTL_HOURS:-}
      META_WRITE_TIMEOUT_SECONDS: ${META_WRITE_TIMEOUT_SECONDS:-}
      MAX_RETRIES_META_WRITE: ${MAX_RETRIES_META_WRITE:-}
      EXECUTING_STATE_STALE_AFTER_MINUTES: ${EXECUTING_STATE_STALE_AFTER_MINUTES:-}
      RECONCILIATION_SCAN_INTERVAL_MINUTES: ${RECONCILIATION_SCAN_INTERVAL_MINUTES:-}
      APPROVAL_PAYLOAD_TTL_MINUTES: ${APPROVAL_PAYLOAD_TTL_MINUTES:-}
      PERFORMANCE_SYNC_INTERVAL_MINUTES: ${PERFORMANCE_SYNC_INTERVAL_MINUTES:-}
      PERFORMANCE_SNAPSHOT_RETENTION_DAYS: ${PERFORMANCE_SNAPSHOT_RETENTION_DAYS:-}
      META_API_RATE_LIMIT_BUFFER_PCT: ${META_API_RATE_LIMIT_BUFFER_PCT:-}
      SYNC_BACKFILL_MAX_DAYS: ${SYNC_BACKFILL_MAX_DAYS:-}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-}
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: ${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:-}
      RATE_LIMIT_AI_ENDPOINTS_PER_MINUTE: ${RATE_LIMIT_AI_ENDPOINTS_PER_MINUTE:-}
      SSE_MAX_STREAM_DURATION_SECONDS: ${SSE_MAX_STREAM_DURATION_SECONDS:-}
      RTO_MINUTES: ${RTO_MINUTES:-}
      RPO_MINUTES: ${RPO_MINUTES:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      RESTORE_TEST_FREQUENCY_DAYS: ${RESTORE_TEST_FREQUENCY_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
