# Package and quality-tool configuration; business policy stays in BUSINESS_CONSTANTS.md.
[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[project]
name = "marketing-ai"
version = "0.1.0"
description = "Maroc Affiliate AI Marketing Assistant"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = ">=0.11.26,<0.12"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-m", "not container and not database"]
markers = [
    "container: real Docker image/build checks; run explicitly with -m container",
    "database: disposable real PostgreSQL checks; run explicitly with -m database",
]
filterwarnings = ["error"]
